<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brickadia Tree Workshop</title><style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101713;color:#e9f3eb}body{margin:0;padding:32px}.app{max-width:900px;margin:auto;background:#18241c;border:1px solid #385442;border-radius:18px;padding:28px;box-shadow:0 18px 60px #0008}h1{margin:0 0 8px;font-size:30px}p{color:#b9cabd;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:24px 0}label{display:grid;gap:7px;color:#dce8de}input,select,button{font:inherit;border:1px solid #4a6752;border-radius:9px;background:#0e1711;color:#eef6ef;padding:10px}input[type=range]{padding:5px}button{background:#315e3c;cursor:pointer;font-weight:700}button:hover{background:#3d744a}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap}.secondary{background:#263a2b}#status{margin:20px 0;padding:14px;background:#101813;border-radius:10px;line-height:1.5}pre{max-height:280px;overflow:auto;background:#0d140f;padding:14px;border-radius:10px;color:#b9d5bf}@media(max-width:650px){body{padding:12px}.grid{grid-template-columns:1fr}}
</style></head><body><main class="app"><h1>Brickadia Tree Workshop</h1><p>Generate one numbered nursery prefab, paste it once in Brickadia, then keep the manifest and report the IDs you like. Every tree uses conservative, grid-valid modules.</p><section class="grid"><label>Seed <span><input id="seed" type="number" value="17421"><button id="randomSeed" type="button">Random</button></span></label><label>Number of trees<input id="count" type="number" min="1" max="20" value="12"></label><label>Style<select id="style"><option>Mixed</option><option>Conifer</option><option>Broadleaf</option></select></label><label>Spacing<input id="spacing" type="number" min="220" max="360" value="260"></label><label>Scale: <output id="scaleValue">1</output><input id="scale" type="range" min="0.7" max="1.4" step="0.05" value="1"></label><label>Variation: <output id="variationValue">0.65</output><input id="variation" type="range" min="0" max="1" step="0.05" value="0.65"></label></section><div class="actions"><button id="generate">Generate nursery</button><button id="downloadBrz" disabled>Download .brz</button><button id="downloadManifest" class="secondary" disabled>Download manifest</button></div><div id="status">Ready.</div><pre id="treeList"></pre></main><script>/*__BUNDLE__*/</script></body></html>
